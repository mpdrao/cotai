name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    name: Backend (unit + integration with Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Docker is available on ubuntu-latest, so *IT classes run against a real PostgreSQL.
      - run: ./mvnw -B -DskipWeb -pl backend verify

  web:
    name: Frontend (Angular build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
