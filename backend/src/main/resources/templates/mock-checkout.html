<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2E5D46">
    <title>Pagamento simulado · Cota Ae!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Cota Ae! design system tokens (frontend/src/styles/cotai-theme.css). Mobile-first. */
        :root {
            --cotai-primary: #2E5D46;
            --cotai-background: #FFF7EF;
            --cotai-ink: #16372A;
            --cotai-surface: #FFFFFF;
            --cotai-muted: #53645B;
            --cotai-border: #ECE8DE;
            --cotai-terracotta: #D96B5B;
            --cotai-warning-bg: #FFF1DE;
            --cotai-warning-ink: #754515;
            --cotai-danger-bg: #FCE9E6;
            --cotai-danger-ink: #8B3530;
            --cotai-success-bg: #E4F3E8;
            --cotai-font: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --cotai-tap-target: 2.75rem;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 1rem;
            display: grid;
            place-items: center;
            background: var(--cotai-background);
            color: var(--cotai-ink);
            font-family: var(--cotai-font);
            line-height: 1.55;
        }
        .card {
            width: 100%;
            max-width: 26rem;
            display: grid;
            gap: 0.75rem;
            padding: 1.25rem;
            background: var(--cotai-surface);
            border: 1px solid var(--cotai-border);
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(46, 93, 70, .065);
            text-align: center;
        }
        .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .brand { font-weight: 700; color: var(--cotai-primary); }
        .badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 600; }
        .badge--pending { background: var(--cotai-warning-bg); color: var(--cotai-warning-ink); }
        .badge--expired { background: var(--cotai-danger-bg); color: var(--cotai-danger-ink); }
        .simulated { margin: 0; font-size: 0.875rem; color: var(--cotai-muted); }
        .amount { margin: 0.25rem 0 0; font-size: 2rem; font-weight: 800; color: var(--cotai-primary); font-variant-numeric: tabular-nums; }
        .description { margin: 0; overflow-wrap: anywhere; }
        .qr { display: block; width: 100%; max-width: 13.75rem; height: auto; margin: 0.25rem auto; }
        .url { margin: 0; font-size: 0.8125rem; color: var(--cotai-muted); overflow-wrap: anywhere; }
        .actions { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
        button {
            min-height: var(--cotai-tap-target);
            padding: 0.7rem 1.25rem;
            border: 2px solid var(--cotai-primary);
            border-radius: 999px;
            font: 600 1rem/1.35 var(--cotai-font);
            cursor: pointer;
        }
        button:focus-visible { outline: 3px solid var(--cotai-terracotta); outline-offset: 3px; }
        button:disabled { opacity: .58; cursor: not-allowed; }
        .approve { background: var(--cotai-primary); color: var(--cotai-surface); }
        .decline { background: var(--cotai-surface); color: var(--cotai-primary); }
        .msg { margin: 0; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.9375rem; }
        .msg:empty { display: none; }
        .msg--ok { background: var(--cotai-success-bg); }
        .msg--error { background: var(--cotai-danger-bg); color: var(--cotai-danger-ink); }
        @media (min-width: 40rem) {
            .card { padding: 1.75rem; }
            .actions { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<main class="card">
    <div class="head">
        <span class="brand">Cota Ae!</span>
        <span th:if="${expired}" class="badge badge--expired">Tempo esgotado</span>
        <span th:unless="${expired}" class="badge badge--pending">Aguardando pagamento</span>
    </div>
    <p class="simulated">Pagamento simulado (ambiente de desenvolvimento). Nenhum valor é cobrado.</p>
    <p class="amount" th:text="${amount}">R$ 0,00</p>
    <p class="description" th:text="${charge.description()}">Item</p>
    <img class="qr" th:src="${qrDataUri}" alt="QR code com o link deste pagamento" width="220" height="220">
    <p class="url" th:text="${charge.checkoutUrl()}">url</p>
    <div class="actions" th:unless="${expired}">
        <button type="button" class="approve" onclick="act('approve')">Aprovar pagamento</button>
        <button type="button" class="decline" onclick="act('decline')">Recusar</button>
    </div>
    <p id="msg" class="msg" role="status"></p>
</main>
<script th:inline="javascript">
    const ref = /*[[${charge.providerReference()}]]*/ 'mock_x';
    async function act(action) {
        const msg = document.getElementById('msg');
        document.querySelectorAll('.actions button').forEach((b) => (b.disabled = true));
        const res = await fetch('/mock-gateway/charges/' + ref + '/' + action, { method: 'POST' });
        if (res.status === 202) {
            msg.className = 'msg msg--ok';
            msg.textContent = action === 'approve'
                ? 'Pagamento aprovado. A reserva é confirmada em instantes; pode fechar esta página.'
                : 'Pagamento recusado. A reserva será cancelada em instantes.';
        } else {
            msg.className = 'msg msg--error';
            msg.textContent = res.status === 410
                ? 'Esta cobrança expirou.'
                : 'Não foi possível concluir (HTTP ' + res.status + ').';
            document.querySelectorAll('.actions button').forEach((b) => (b.disabled = false));
        }
    }
</script>
</body>
</html>
