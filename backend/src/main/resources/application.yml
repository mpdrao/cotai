spring:
  application:
    name: cotai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cotai}
    username: ${DB_USER:cotai}
    password: ${DB_PASSWORD:cotai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Item photos (PhotoFormat.MAX_BYTES). The request limit leaves room for the multipart envelope.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  zone: America/Sao_Paulo
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  manage-token-secret: ${MANAGE_TOKEN_SECRET:change-me-manage-token-secret-0123456789}
  jwt:
    secret: ${JWT_SECRET:change-me-jwt-secret-at-least-32-bytes-long}
    ttl-seconds: 3600

payment:
  # HMAC-SHA256 key used to sign / verify webhook bodies. Override in every real environment.
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:change-me-webhook-secret}
  gateway-timeout-ms: 3000
  max-pending-reservations-per-email: 3
