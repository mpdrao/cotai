services:
  postgres:
    image: postgres:17
    container_name: cotai-postgres
    environment:
      POSTGRES_DB: cotai
      POSTGRES_USER: cotai
      POSTGRES_PASSWORD: cotai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotai -d cotai"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    build:
      context: ./proxy
    container_name: cotai-proxy
    environment:
      PROXY_USERNAME: ${PROXY_USERNAME:-cotai_proxy}
      PROXY_PASSWORD: ${PROXY_PASSWORD:?Defina PROXY_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:3128:3128"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/squid/passwd && /usr/sbin/squid -k check -f /etc/squid/squid.conf"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
