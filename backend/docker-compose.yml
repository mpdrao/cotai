services:
  postgres:
    image: postgres:17
    container_name: cotai-postgres
    environment:
      POSTGRES_DB: cotai
      POSTGRES_USER: cotai
      POSTGRES_PASSWORD: cotai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotai -d cotai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
